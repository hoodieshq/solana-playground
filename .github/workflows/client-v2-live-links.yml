name: client-v2 live links

# The `@live-links` browser specs: every GitHub link the app offers (the import
# dialog's examples, the build server's tip) requested from github.com. Kept
# out of the PR suite (`reusable-client-v2.yml`), where a GitHub outage would
# fail unrelated PRs; weekly, so a path the examples repository drops shows up
# here before a user meets it. On the wasm stubs: no spec here needs them.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USE_WASM_STUBS: "true"
    defaults:
      run:
        working-directory: client-v2

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: client-v2/.nvmrc
          cache: "yarn"
          cache-dependency-path: "client-v2/yarn.lock"

      - name: Stub the WASM packages and install
        run: bash scripts/setup-wasm.sh

      - name: Install Chromium
        run: yarn playwright install --with-deps chromium

      - name: Live link specs
        run: yarn test-e2e --grep @live-links
