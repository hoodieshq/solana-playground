name: client-v2

# Guards `client-v2/` on the real wasm packages, the ones every deployment
# ships. The jobs live in `client-v2-reusable.yml`; `client-v2-with-stubs.yml`
# runs the same jobs on the stubs, by hand.
on:
  push:
    branches: ["master", "master-2.0"]
  pull_request:
    branches: ["master", "master-2.0"]

  workflow_dispatch:

concurrency:
  group: client-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-v2:
    uses: ./.github/workflows/client-v2-reusable.yml
    with:
      use-wasm-stubs: false
