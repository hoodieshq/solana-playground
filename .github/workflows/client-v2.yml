name: client-v2

# Types, formatting, the unit and API suites, the CI=true production bundle
# and the browser suite for the fork's frontend. Upstream's ci.yml guards
# `client/` on master; this one guards `client-v2/` on master-2.0 and never
# touches the Rust workspaces.
on:
  push:
    branches: ["master-2.0"]
  pull_request:
    branches: ["master-2.0"]

  workflow_dispatch:

concurrency:
  group: client-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # The API suite's integration cases skip themselves without this, so
      # without it they would pass by not running.
      #
      # `sslmode=disable` is an explicit opt-out, not a workaround: this
      # service container serves no TLS at all. Both dbmate and the app
      # otherwise require an encrypted, verified connection, which is what a
      # real database gets.
      DATABASE_URL: postgres://solpg:solpg@localhost:5432/solpg?sslmode=disable

    # Ours, not the Rust server's MongoDB -- that one is untouched and is not
    # needed here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: solpg
          POSTGRES_PASSWORD: solpg
          POSTGRES_DB: solpg
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: client-v2

    steps:
      # `client-v2/public` is not tracked: scripts/update-static.mjs copies
      # it out of the `client/public` submodule and dates each tutorial
      # from that submodule's history, so the submodule is checked out
      # with full history.
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: client-v2/.nvmrc
          cache: "yarn"
          cache-dependency-path: "client-v2/yarn.lock"

      # Six of the eight local `wasm/*/pkg` deps are compiled from Rust
      # (about an hour). `yarn install` refuses to run while the
      # directories are missing, so stand them in; none is on the UI or
      # test path.
      - name: Stub the unbuilt WASM packages
        run: ../wasm/stub-packages.sh

      - name: Install
        run: yarn install --frozen-lockfile

      # Same cheap chain as `yarn dev`: static assets, export barrels,
      # package and tutorial data, assistant context. The build step runs
      # it again internally; it is here so type-check and tests see the
      # generated files too.
      - name: Generate
        run: yarn generate-fast

      # Pinned rather than `latest`: a migration tool that changes under CI
      # without anyone asking is a bad trade for the few seconds saved.
      - name: Install dbmate
        run: |
          curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.35.1/dbmate-linux-amd64
          chmod +x /usr/local/bin/dbmate

      # Applied explicitly, never from a function. This also proves the
      # migrations actually run from scratch, which a database that is only
      # ever migrated forward locally does not.
      - name: Apply migrations
        run: yarn db-migrate

      # db/schema.sql is derived from db/migrations/, and a stale one misleads
      # every reviewer -- it is the file people actually read. Regenerating it
      # from the migrations just applied proves it still matches. `db-dump`
      # takes pg_dump from the postgres:16 image here too, so its output matches
      # a local re-dump byte for byte.
      - name: Check db/schema.sql is current
        run: |
          yarn db-dump
          git diff --exit-code -- db/schema.sql || {
            echo "::error::db/schema.sql is stale -- run 'yarn db-dump' and commit the result"
            exit 1
          }

      - name: Check types
        run: yarn test-types

      - name: Check format
        run: yarn check-format

      # `openspec validate --all` over ../openspec: every active change has
      # its proposal, delta specs, design and tasks in the schema's shape.
      - name: Validate specs
        run: yarn spec:validate

      # A change with every task ticked must be archived in the PR that
      # ticked the last one (client-v2/CLAUDE.md, "Specs and changes").
      - name: Archived changes
        run: yarn spec:archived

      - name: Unit tests
        run: yarn test-unit

      # `node --test`, not vitest: `api/*.mjs` and the `.mjs` modules
      # behind each feature's `server.mjs` are plain ESM outside the
      # TypeScript build and need real Node.
      - name: API tests
        run: yarn test-api

      - name: Production build
        run: yarn build-fast

      # Tailwind reaches the bundle only through craco's PostCSS override. If
      # that stops applying (a craco upgrade, a second CSS rule added after
      # craco's style pass), the build stays green and the page ships
      # unstyled, so look for one utility the Flow wrapper always carries.
      - name: Check Tailwind is in the built CSS
        run: |
          grep -q '\.flex{display:flex}' build/static/css/main.*.css || {
            echo "::error::Tailwind utilities are missing from build/static/css -- craco's PostCSS override is not applying"
            exit 1
          }

  # The browser suite (`client-v2/e2e/`, Playwright). Its own job, so the
  # checks above keep their five minutes and a browser failure is read as
  # one. Every spec stubs the account endpoints with `page.route`, and the
  # dev server serves `api/*.mjs` itself (`craco.config.js`), so no Postgres
  # service and no secret is needed here: `/api/agent` answers
  # `configured: false`, and the two assistant-reconnect tests that must
  # connect to the keyless default backend skip themselves with that as the
  # stated reason (`hasDefaultBackend` in `e2e/fixtures.ts`). With
  # two-tabs:224 and account-sync:289, quarantined on the runner by
  # `test.fixme` for the sync owners (HOO-1720), they are the suite's known
  # gap, recorded as D61 in decisions.md on `context-archive`, not a flake.
  #
  # `CI=true` makes `playwright.config.ts` start its own `yarn dev` rather
  # than reuse one, retry a failed spec once, and report through the
  # `github` annotator as well as `list`; the config says why one retry and
  # why none locally.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Measured locally at under five minutes for the suite plus a minute of
    # dev-server boot (the dated number is in D61); a 2-vCPU runner is two to
    # three times slower, so this is generous rather than tight. A genuine
    # hang still fails, just later.
    timeout-minutes: 30
    env:
      CI: "true"

    defaults:
      run:
        working-directory: client-v2

    steps:
      # Same checkout as `checks`: `client-v2/public` is generated out of the
      # `client/public` submodule, dated from its history.
      - uses: actions/checkout@v6
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: client-v2/.nvmrc
          cache: "yarn"
          cache-dependency-path: "client-v2/yarn.lock"

      - name: Stub the unbuilt WASM packages
        run: ../wasm/stub-packages.sh

      - name: Install
        run: yarn install --frozen-lockfile

      # The browser binary is cached by Playwright version, so only a bump
      # re-downloads it. The runner's system libraries are not cached: on a
      # hit they are installed alone (`install-deps`), on a miss together
      # with the browser (`--with-deps`).
      #
      # restore + save rather than `actions/cache`, whose post step saves
      # only when the job succeeds: while the suite is red, every run would
      # download Chromium again, and a red suite is when runs are frequent.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium

      - uses: actions/cache/save@v6
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium

      # `yarn dev` runs `generate-fast` itself before `craco start`, and the
      # config starts it (`webServer`), so there is no separate generate step.
      - name: Browser tests
        run: yarn test-e2e

      # A skipped test is green to Playwright, and a test that passed on its
      # retry is green too; neither the `list` nor the `github` reporter
      # says why or which. Both are read out of the json report here. The
      # four skips the job expects are named, and one more -- a spec that
      # adopted the guard, or `/api/agent` falling over -- fails rather than
      # widening the gap quietly. A flaky test is a warning with its title:
      # not a pass, work to do, and visible on the run's summary page.
      - name: Count skips and name flakes
        if: always()
        run: |
          report=test-results/report.json
          [ -f "$report" ] || { echo "::error::no $report -- the suite did not run to a report"; exit 1; }
          skipped=$(node -p "require('./$report').stats.skipped")
          echo "::notice title=e2e skips::$skipped skipped -- the two assistant-reconnect tests that connect to the default backend, two-tabs:224 and account-sync:289 (HOO-1720); see D61"
          node -e '
            const r = require("./'"$report"'");
            const flaky = [];
            const walk = (s, path) => {
              for (const sub of s.suites ?? []) walk(sub, [...path, sub.title]);
              for (const spec of s.specs ?? [])
                for (const t of spec.tests ?? [])
                  if (t.status === "flaky") flaky.push(`${path.join(" > ")} > ${spec.title}`);
            };
            for (const s of r.suites) walk(s, [s.title]);
            for (const f of flaky) console.log(`::warning title=flaky e2e test::${f} -- failed once on this runner, passed on retry; the failed attempt'"'"'s trace is in the artifact`);
            console.log(`${flaky.length} flaky`);
          '
          [ "$skipped" -le 4 ] || { echo "::error::$skipped tests skipped, at most 4 are accounted for"; exit 1; }

      # Traces, screenshots and the per-test error context of what failed.
      # Open a trace with `yarn playwright show-trace <file>`. `always()`,
      # not `failure()`: a run that `timeout-minutes` cancels is the one whose
      # trace matters most, and `failure()` does not fire for it. On a green
      # run the directory holds the json report and little else.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-test-results
          path: client-v2/test-results/
          retention-days: 7
          if-no-files-found: warn
