name: Rollback Server

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to roll back to (e.g. v1.0.0)"
        required: true
        type: string
      delete_tag:
        description: "Tag to delete after rollback (leave empty to skip)"
        required: false
        type: string

jobs:
  rollback:
    name: Rollback to ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: ${{ inputs.version }}. Must match vX.Y.Z"
            exit 1
          fi
          if [[ -n "${{ inputs.delete_tag }}" && ! "${{ inputs.delete_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid delete_tag format: ${{ inputs.delete_tag }}. Must match vX.Y.Z"
            exit 1
          fi

      - name: Load deploy config
        run: cat infra/.env.deploy >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Rollback to ${{ inputs.version }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/server"
          gcloud compute ssh ${{ env.GCE_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --tunnel-through-iap \
            --command="/opt/solpg/infra/deploy.sh ${IMAGE}:${{ inputs.version }}"

      - name: Delete tag ${{ inputs.delete_tag }}
        if: inputs.delete_tag != ''
        run: |
          git push origin --delete "${{ inputs.delete_tag }}"

      - name: Verify
        run: |
          gcloud compute ssh ${{ env.GCE_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --tunnel-through-iap \
            --command="cd /opt/solpg && docker compose --profile prod ps server"
