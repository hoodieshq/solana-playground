name: Rollback Server

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App Engine version to roll back to (e.g. v1.0.0)"
        required: true
        type: string
      delete_tag:
        description: "Tag to delete after rollback (leave empty to skip)"
        required: false
        type: string

jobs:
  rollback:
    name: Rollback to ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate inputs
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version format: ${{ inputs.version }}. Must match vX.Y.Z"
            exit 1
          fi
          if [[ -n "${{ inputs.delete_tag }}" && ! "${{ inputs.delete_tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid delete_tag format: ${{ inputs.delete_tag }}. Must match vX.Y.Z"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Rollback to ${{ inputs.version }}
        run: |
          VERSION=$(echo "${{ inputs.version }}" | tr '.' '-')
          gcloud app versions migrate "$VERSION" \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --service=default \
            --quiet

      - name: Delete tag ${{ inputs.delete_tag }}
        if: inputs.delete_tag != ''
        run: |
          git push origin --delete "${{ inputs.delete_tag }}"

      - name: Verify
        run: |
          gcloud app versions list \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --service=default \
            --format="table(version.id,traffic_split,version.servingStatus)"
