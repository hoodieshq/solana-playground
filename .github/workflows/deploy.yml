name: Deploy Server

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    name: Build & Push Server Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.tag.outputs.version }}
      image: ${{ steps.tag.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Load deploy config
        run: cat infra/.env.deploy >> "$GITHUB_ENV"

      - name: Extract and validate tag
        id: tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: ${VERSION}. Must match vX.Y.Z"
            exit 1
          fi
          IMAGE="${{ env.REGISTRY }}/${{ github.repository }}/server"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.version }}
            ${{ steps.tag.outputs.image }}:latest

  deploy:
    name: Deploy to GCE
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Load deploy config
        run: cat infra/.env.deploy >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy version ${{ needs.build-and-push.outputs.version }}
        run: |
          gcloud compute ssh ${{ env.GCE_INSTANCE }} \
            --zone=${{ env.GCP_ZONE }} \
            --tunnel-through-iap \
            --command="/opt/solpg/infra/deploy.sh ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.version }}"
