name: Deploy Server

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    name: Deploy to App Engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract and validate tag
        id: tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: ${VERSION}. Must match vX.Y.Z"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy ${{ steps.tag.outputs.version }} to App Engine
        run: |
          gcloud app deploy server/app.yaml \
            --project=${{ secrets.GCP_PROJECT_ID }} \
            --version=$(echo "${{ steps.tag.outputs.version }}" | tr '.' '-') \
            --set-env-vars="PG_DB_URI=${{ secrets.MONGODB_URI }}" \
            --quiet
