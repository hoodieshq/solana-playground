<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Files toggle prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500&family=Stack+Sans+Headline:wght@400..700&family=Stack+Sans+Text:wght@300..700&display=swap">
<style>
/* DES-205: the file tree as a column the editor head opens and closes, on an ordinary Playground screen. The tokens
   are tutorial-v2's dark theme, the shell the TS-only docs prototype (DES-203) draws */
:root {
  --background: #141413;
  --foreground: #cbc9c0;
  --heading: #f5f4ee;
  --muted-foreground: #9a988f;
  --tertiary: #75736c;
  --border: rgb(222 220 209 / 0.1);
  --border-strong: rgb(222 220 209 / 0.15);
  --sidebar: #1a1918;
  --surface-base: #141413;
  --surface-panel: #1f1e1d;
  --surface-raised: #262624;
  --surface-hover: #1f1e1d;
  --surface-well: #0f0f0e;
  --success: #14f195;
  --font-headline: "Stack Sans Headline", "Manrope", -apple-system, sans-serif;
  --font-text: "Stack Sans Text", "Manrope", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --font-code: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b0b0c; color: var(--foreground); font-family: var(--font-text); }
button { font: inherit; color: inherit; cursor: pointer; }

/* Review bar: not part of the design */
.review { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #131314; position: sticky; top: 0; z-index: 10; }
.review h1 { font: 500 14px/1.2 var(--font-text); margin: 0; color: var(--muted-foreground); }
.review h1 b { color: var(--heading); font-weight: 500; }
.seg { display: inline-flex; background: var(--surface-panel); border: 1px solid var(--border); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 999px; font-size: 13px; color: var(--muted-foreground); }
.seg button[aria-pressed="true"] { background: var(--surface-raised); color: var(--heading); }
.note { flex-basis: 100%; font-size: 12.5px; color: var(--muted-foreground); line-height: 1.45; max-width: 980px; }
.canvas { display: flex; justify-content: center; padding: 20px 16px 40px; overflow: hidden; }
.scaler { position: relative; }
#frame { transform-origin: top left; position: absolute; top: 0; left: 0; }

.desktop { width: 1440px; height: 900px; border: 1px solid var(--border-strong); border-radius: 12px; overflow: hidden; background: var(--surface-base); color-scheme: dark; }
.desktop * { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.app { display: grid; grid-template-columns: 232px 340px minmax(0, 1fr); height: 100%; }

/* Nav, as tutorial-v2's desktop/Nav.tsx */
.nav { border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--sidebar); font-size: 13px; }
.logo { height: 44px; display: flex; align-items: center; padding: 0 8px 0 16px; border-bottom: 1px solid var(--border); color: var(--foreground); }
.logo svg { height: 28px; width: auto; }
.navlist { flex: 1; padding: 12px 8px 0; display: flex; flex-direction: column; gap: 1px; }
.nav .item { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 6px; color: var(--muted-foreground); }
.nav .item.active { background: var(--surface-hover); color: var(--foreground); font-weight: 500; }
.nav .ic { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
.nav .ic svg { width: 100%; height: 100%; }
.nav .sec { color: var(--tertiary); font-size: 12px; padding: 0 8px; margin: 20px 0 4px; }
.nav .foot { padding: 6px 8px 8px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--success); display: inline-block; }

/* Assistant */
.assistant { border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.colhead { height: 44px; flex: none; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 500; color: var(--heading); }
.empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 8px; }
.empty h3 { font: 500 20px/24px var(--font-headline); margin: 0; color: var(--heading); }
.empty p { margin: 0; font-size: 14px; line-height: 20px; color: var(--muted-foreground); max-width: 260px; }
.composer { margin: 12px 20px 20px; border: 1px solid var(--border); border-radius: 14px; height: 44px; display: flex; align-items: center; padding: 0 14px; color: var(--tertiary); font-size: 15px; background: var(--surface-panel); }

/* Workspace: the stage row, then the body, then the terminal */
.work { display: grid; grid-template-rows: 44px minmax(0, 1fr) auto; min-width: 0; min-height: 0; overflow: hidden; }
.stagerow { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 8px; }
.stagerow .tab { flex: 1; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--muted-foreground); }
.stagerow .tab.on { background: var(--surface-raised); color: var(--heading); font-weight: 500; }

.body { display: grid; min-height: 0; overflow: hidden; }
.tree { border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 1px; font-size: 13px; min-height: 0; }
.tree .rows { flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 1px; }
.tree .row { height: 28px; padding: 0 8px; border-radius: 6px; display: flex; gap: 6px; align-items: center; color: var(--muted-foreground); border: 0; background: transparent; text-align: left; width: 100%; }
.tree .row.file:hover { color: var(--foreground); }
.tree .row.sel { background: var(--surface-hover); color: var(--heading); }
.tree .row svg { width: 14px; height: 14px; flex: none; }
.tree .newfile { height: 36px; padding: 0 16px; display: flex; align-items: center; border-top: 1px solid var(--border); color: var(--muted-foreground); }
.stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

/* Before: the editor's own tab strip, a folder-style tab */
.edtabs-old { height: 44px; flex: none; display: flex; align-items: flex-end; border-bottom: 1px solid var(--border); padding: 0 8px; }
.edtabs-old .edtab { padding: 9px 12px; font-size: 13px; border: 1px solid var(--border); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--surface-panel); color: var(--heading); }

/* After: one head over the tree and the editor, so nothing moves when the tree opens */
.edhead { grid-column: 1 / -1; height: 44px; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--border); padding: 0 8px 0 16px; }
.edhead .name { font-size: 13px; color: var(--heading); }
.edhead .path { font-size: 13px; color: var(--tertiary); }
.edhead .grow { flex: 1; }
.tool { width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--muted-foreground); display: grid; place-items: center; }
.tool svg { width: 18px; height: 18px; }
.tool:hover { color: var(--foreground); }
.tool[aria-pressed="true"] { background: var(--surface-hover); color: var(--foreground); }

.code { flex: 1; overflow: auto; font: 13px/20.8px var(--font-code); padding: 8px 0 24px; min-height: 0; }
.code .lines { display: inline-block; min-width: 100%; }
.code .ln { display: grid; grid-template-columns: 48px 1fr; white-space: pre; }
.code .ln .n { color: var(--muted-foreground); font: 320 13px/20.8px var(--font-text); text-align: right; padding-right: 16px; user-select: none; }
.k { color: #ec4899; } .s { color: #f59e0b; } .c { color: var(--muted-foreground); } .t { color: #38bdf8; } .m { color: #14f195; }

.term { border-top: 1px solid var(--border); background: var(--surface-well); display: flex; flex-direction: column; }
.termhead { height: 28px; display: flex; align-items: center; gap: 8px; padding: 0 10px; font-size: 12px; color: var(--muted-foreground); }
.termhead .grow { flex: 1; }
.termhead button { border: 0; background: transparent; color: var(--muted-foreground); font-size: 12px; }
.termbody { height: 220px; overflow: auto; border-top: 1px solid var(--border); font: 13px/20px var(--font-code); padding: 8px 12px; white-space: pre-wrap; }
.termbody .dim { color: var(--muted-foreground); } .termbody .ok { color: var(--success); }

/* Callouts that point at the change. Review only */
.pin { position: absolute; z-index: 5; background: #f5f4ee; color: #141413; font: 500 12px/16px var(--font-text); padding: 6px 10px; border-radius: 8px; white-space: nowrap; box-shadow: 0 8px 24px rgb(0 0 0 / 0.4); pointer-events: none; }
.pin::after { content: ""; position: absolute; width: 10px; height: 10px; background: inherit; transform: rotate(45deg); }
.pin.up::after { top: -4px; right: 18px; }
.desktop { position: relative; }
</style>
</head>
<body>
<header class="review">
  <h1><b>Files in the editor head</b> · DES-205 · prototype</h1>
  <div class="seg" id="mode">
    <button data-v="before">Before: 4 columns</button>
    <button data-v="after" aria-pressed="true">After: 3 columns</button>
  </div>
  <div class="note" id="note"></div>
</header>
<div class="canvas"><div class="scaler" id="scaler"><div id="frame"></div></div></div>

const ICON = {
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  term: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m4 17 6-6-6-6"/><path d="M12 19h8"/></svg>',
};

const FILES = {
  "src/lib.rs": [
    "use anchor_lang::prelude::*;",
    "",
    "declare_id!(\"11111111111111111111111111111111\");",
    "",
    "#[program]",
    "mod hello_anchor {",
    "    use super::*;",
    "",
    "    pub fn hello(_ctx: Context<Hello>, name: String) -> Result<()> {",
    "        msg!(\"Hello, {}!\", name);",
    "        Ok(())",
    "    }",
    "}",
    "",
    "#[derive(Accounts)]",
    "pub struct Hello {}",
  ],
  "client/client.ts": [
    "// Calls hello with your name and prints the program's log",
    "const tx = await pg.program.methods.hello(\"Almaz\").rpc();",
    "console.log(\"Signature:\", tx);",
  ],
  "tests/anchor.test.ts": [
    "describe(\"hello_anchor\", () => {",
    "  it(\"says hello\", async () => {",
    "    const tx = await pg.program.methods.hello(\"test\").rpc();",
    "    assert.ok(tx);",
    "  });",
    "});",
  ],
};
const TREE = [
  { dir: "src", files: ["src/lib.rs"] },
  { dir: "client", files: ["client/client.ts"] },
  { dir: "tests", files: ["tests/anchor.test.ts"] },
];

const S = { mode: "after", tree: false, term: true, open: "src/lib.rs", found: false };

const NOTES = {
  before: "Today: the file tree is a fixed fourth column between the assistant and the editor, and the editor has a tab strip of its own.",
  after: "The tree is gone from the layout until you want it: the folder icon at the top right of the editor opens it as a column left of the code, a second click closes it. The terminal icon next to it does the same for the terminal. Click a file in the tree to open it.",
};

const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function hl(line) {
  if (/^\s*\/\//.test(line)) return `<span class="c">${esc(line)}</span>`;
  return esc(line)
    .replace(/(&quot;|")([^"]*)(")/g, '<span class="s">"$2"</span>')
    .replace(/\b(use|mod|pub|fn|struct|const|await|async|describe|it)\b/g, '<span class="k">$1</span>')
    .replace(/\b(Context|Result|String|Accounts)\b/g, '<span class="t">$1</span>')
    .replace(/\bHello\b(?=&gt;| \{)/g, '<span class="t">Hello</span>')
    .replace(/\b(msg!|declare_id!)/g, '<span class="m">$1</span>')
    .replace(/(#\[[^\]]+\])/g, '<span class="t">$1</span>');
}
const codeHTML = () => '<div class="code"><div class="lines">' + FILES[S.open].map((l, i) => `<div class="ln"><span class="n">${i + 1}</span><span>${hl(l) || " "}</span></div>`).join("") + "</div></div>";

const treeHTML = (newfile) => `<div class="tree"><div class="rows">${TREE.map((d) => `<div class="row">${ICON.folder}${d.dir}</div>` + d.files.map((f) => `<button class="row file${f === S.open ? " sel" : ""}" style="padding-left:24px" data-file="${f}">${ICON.file}${f.split("/").pop()}</button>`).join("")).join("")}</div>${newfile ? '<div class="newfile">+ New file</div>' : ""}</div>`;

const termHTML = (withHead) => `<div class="term">${withHead ? `<div class="termhead"><span>Terminal</span><span class="grow"></span><button data-act="term">${S.term ? "Hide" : "Show"}</button></div>` : ""}${S.term ? `<div class="termbody"><span class="dim">$ anchor build</span>
Building hello_anchor…
<span class="ok">Build successful</span> · 1 instruction (hello)</div>` : ""}</div>`;

function render() {
  const before = S.mode === "before";
  const tabs = ["Write", "Build", "Deploy", "Interact"].map((t, i) => `<div class="tab${i === 0 ? " on" : ""}">${t}</div>`).join("");
  const name = S.open.split("/").pop();
  const body = before
    ? `<div class="body" style="grid-template-columns:240px minmax(0,1fr)">
        <div style="display:flex;flex-direction:column;min-height:0"><div class="colhead">Files</div>${treeHTML(true)}</div>
        <div class="stage"><div class="edtabs-old"><div class="edtab">${name}</div></div>${codeHTML()}</div>
      </div>`
    : `<div class="body" style="grid-template-rows:44px minmax(0,1fr);grid-template-columns:${S.tree ? "240px " : ""}minmax(0,1fr)">
        <div class="edhead"><span class="name">${name}</span><span class="path">${S.open.slice(0, S.open.lastIndexOf("/"))}</span><span class="grow"></span>
          <button class="tool" data-act="tree" aria-label="Files" aria-pressed="${S.tree}" title="Files">${ICON.folder}</button>
          <button class="tool" data-act="term" aria-label="Terminal" aria-pressed="${S.term}" title="Terminal">${ICON.term}</button></div>
        ${S.tree ? treeHTML(true) : ""}
        <div class="stage">${codeHTML()}</div>
      </div>`;
  document.getElementById("frame").innerHTML = `<div class="desktop"><div class="app">
    <div class="nav">
      <div class="logo">${BRAND.logo}</div>
      <div class="navlist">
        <div class="item"><span class="ic">${BRAND.home}</span>Home</div><div class="item"><span class="ic">${BRAND.new}</span>New project</div><div class="item"><span class="ic">${BRAND.tutorial}</span>Tutorials</div><div class="item"><span class="ic">${BRAND.programs}</span>Programs</div>
        <div class="sec">Projects</div>
        <div class="item active"><span class="ic">${ICON.folder}</span>hello_anchor</div>
        <div class="item"><span class="ic">${ICON.folder}</span>counter</div>
      </div>
      <div class="foot"><div class="item"><span class="ic"><span class="dot"></span></span>Devnet</div></div>
    </div>
    <div class="assistant"><div class="colhead">Assistant</div>
      <div class="empty"><h3>Ask about hello_anchor</h3><p>It reads the file you're looking at and the last build.</p></div>
      <div class="composer">Ask about this project…</div></div>
    <div class="work">
      <div class="stagerow">${tabs}</div>
      ${body}
      ${termHTML(before)}
    </div>
  </div>${before || S.found ? "" : '<div class="pin up" style="top:96px;right:40px">Files opens and closes the tree</div>'}</div>`;
  document.getElementById("note").textContent = NOTES[S.mode];
  fit();
}

function fit() {
  const s = Math.min(1, (document.documentElement.clientWidth - 32) / 1442, Math.max((window.innerHeight - document.querySelector(".review").offsetHeight - 64) / 902, 0.5));
  document.getElementById("frame").style.transform = `scale(${s})`;
  const sc = document.getElementById("scaler");
  sc.style.width = 1442 * s + "px";
  sc.style.height = 902 * s + "px";
}

document.addEventListener("click", (e) => {
  const m = e.target.closest("#mode button");
  if (m) {
    S.mode = m.dataset.v;
    document.querySelectorAll("#mode button").forEach((b) => b.setAttribute("aria-pressed", b === m));
    return render();
  }
  const f = e.target.closest("[data-file]");
  if (f) { S.open = f.dataset.file; return render(); }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  // The pointer to the icon goes once it has been found, so it never sits over the code
  if (b.dataset.act === "tree") { S.tree = !S.tree; S.found = true; }
  if (b.dataset.act === "term") S.term = !S.term;
  render();
});
window.addEventListener("resize", fit);
render();
</script>
</body>
</html>
