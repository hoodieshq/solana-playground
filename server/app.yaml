service: playground-server
runtime: custom
env: flex

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 1

resources:
  cpu: 2
  memory_gb: 4
  disk_size_gb: 20

env_variables:
  # Non-secret defaults; PG_-prefixed keys defined in server/src/config.rs.
  PG_PORT: "8080"
  PG_DB_NAME: "solpg"
  PG_VERBOSE: "false"
  PG_PAYLOAD_LIMIT: "1048576"
  #
  # The deploy workflow merges these via `gcloud app deploy --update-env-vars`
  # using values from GCP Secret Manager (see `scripts/read-secrets.sh`):
  #   PG_CLIENT_URL  — public web hostname (CORS origin)
  #   PG_DB_URI      — MongoDB connection string
  #   PG_API_KEY     — current shared key (sent by the web proxy)
  #   PG_API_KEYS    — comma-separated list (current + previous, for rotation)

liveness_check:
  path: "/"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2

readiness_check:
  path: "/"
  check_interval_sec: 10
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2
  app_start_timeout_sec: 300
