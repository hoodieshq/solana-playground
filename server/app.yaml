runtime: custom
env: flex

resources:
  cpu: 4
  memory_gb: 16
  disk_size_gb: 50

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 1
  cool_down_period_sec: 120
  cpu_utilization:
    target_utilization: 0.8

env_variables:
  PG_CLIENT_URL: "https://beta.solpg.io"
  RUST_LOG: "info"

liveness_check:
  path: "/"
  check_interval_sec: 30
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2

readiness_check:
  path: "/"
  check_interval_sec: 10
  timeout_sec: 4
  failure_threshold: 4
  success_threshold: 2
