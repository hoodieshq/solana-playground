name: "solana-playground"

x-client: &client
  platform: linux/amd64
  depends_on:
    wasm:
      condition: service_completed_successfully
    server:
      condition: service_started
  build:
    context: .
    dockerfile: ./client/Dockerfile
    args:
      USER: solpg
      HAS_SERVER: true
    additional_contexts:
      solana-playground-wasm: service:wasm
      solana-playground-server: service:server
  ports:
    - ${PG_CLIENT_PORT:-3000}:3000

services:
  client:
    <<: *client
    tty: true
    stdin_open: true
    profiles:
      - dev

  client-prod:
    <<: *client
    command: ["sh", "-c", "yarn build && npx serve -s build"]
    profiles:
      - prod

  client-standalone:
    platform: linux/amd64
    depends_on:
      wasm:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: ./client/Dockerfile
      args:
        USER: solpg
        HAS_SERVER: ${PG_SERVER:-false}
      additional_contexts:
        solana-playground-wasm: service:wasm
    ports:
      - ${PG_CLIENT_PORT:-3000}:3000
    volumes:
      - ./client:/home/solpg/client
      - /home/solpg/client/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    tty: true
    stdin_open: true
    profiles:
      - standalone

  server:
    platform: linux/amd64
    depends_on:
      - db
    build:
      context: ./server
      args:
        USER: solpg
    ports:
      - ${PG_PORT:-8080}:8080
    env_file:
      - path: .env
        required: false
    environment:
      - PG_API_KEY=${PG_API_KEY:-}
      - PG_API_KEYS=${PG_API_KEYS:-}
      - PG_DB_URI=${PG_DB_URI:-mongodb://db:27017}
    profiles:
      - dev
      - prod
      - prod_next

  wasm:
    platform: linux/amd64
    build:
      context: ./wasm
    profiles:
      - dev
      - prod
      - prod_next
      - standalone

  db:
    image: mongo:7
    volumes:
      - mongodb:/data/db
    command: mongod --quiet --logpath /dev/null
    profiles:
      - dev
      - prod
      - prod_next

  client-build:
    platform: linux/amd64
    depends_on:
      wasm:
        condition: service_completed_successfully
      server:
        condition: service_started
    build:
      context: .
      dockerfile: ./client/Dockerfile.build
      additional_contexts:
        solana-playground-wasm: service:wasm
        solana-playground-server: service:server
    profiles:
      - prod_next

  web:
    platform: linux/amd64
    depends_on:
      client-build:
        condition: service_completed_successfully
      server:
        condition: service_started
    build:
      context: .
      dockerfile: ./web/Dockerfile
      additional_contexts:
        solana-playground-client-build: service:client-build
    ports:
      - ${PG_CLIENT_PORT:-3000}:8080
    environment:
      - PG_API_KEY=${PG_API_KEY:-}
      - PG_SERVER_URL=http://server:8080
    profiles:
      - prod_next

volumes:
  mongodb:
